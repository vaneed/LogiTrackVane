spring.application.name=logitrack
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/logitrack?serverTimezone=UTC}
spring.datasource.username=campus2023
spring.datasource.password=campus2023
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=8080
# Define una clave de al menos 32 caracteres en las variables de IntelliJ.
app.jwt.secret=${JWT_SECRET}
app.jwt.minutos=60
springdoc.swagger-ui.path=/swagger-ui.html
